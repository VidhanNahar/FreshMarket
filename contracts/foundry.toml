[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
# Whitechain Sepolia runs Prague; Prague is the highest target valid on both Whitechain networks.
evm_version = "prague"
optimizer = true
optimizer_runs = 200
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]

[rpc_endpoints]
whitechain_sepolia = "${WHITECHAIN_SEPOLIA_RPC_URL}"

[fuzz]
runs = 512
